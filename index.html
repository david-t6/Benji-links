<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3e6d0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a120e" media="(prefers-color-scheme: dark)">
  <title>Benji links</title>
  <style>
    :root {
      --bg: #f3e6d0;
      --glow: rgba(255, 248, 236, 0.9);
      --card: #fff9f0;
      --ink: #3a2416;
      --muted: #7a5b45;
      --accent: #b4532a;
      --accent-ink: #fffaf5;
      --line: rgba(90, 52, 28, 0.16);
      --shadow: rgba(70, 36, 12, 0.14);
      --cup: rgba(180, 83, 42, 0.14);
      --press: rgba(90, 40, 12, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a120e;
        --glow: rgba(62, 40, 26, 0.55);
        --card: #2a1e18;
        --ink: #f6eadc;
        --muted: #d2b79a;
        --accent: #e3925a;
        --accent-ink: #2a140c;
        --line: rgba(242, 214, 184, 0.16);
        --shadow: rgba(0, 0, 0, 0.35);
        --cup: rgba(227, 146, 90, 0.16);
        --press: rgba(0, 0, 0, 0.28);
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; height: 100%; background: var(--bg); }

    body {
      font-family: ui-rounded, "Avenir Next", "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      min-height: 100%;
      min-height: 100dvh;
      background-image:
        radial-gradient(circle at 14% 12%, rgba(180, 83, 42, 0.18) 0 2px, transparent 3px),
        radial-gradient(circle at 86% 18%, rgba(90, 52, 28, 0.16) 0 2px, transparent 3px),
        radial-gradient(circle at 78% 88%, rgba(180, 83, 42, 0.16) 0 3px, transparent 4px),
        radial-gradient(circle at 10% 84%, rgba(90, 52, 28, 0.12) 0 2px, transparent 3px),
        radial-gradient(ellipse 90% 55% at 50% -20%, var(--glow), transparent 70%);
      display: flex;
      align-items: center;
      align-items: safe center;
      justify-content: center;
      justify-content: safe center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    .card {
      width: min(420px, 100%);
      background: var(--card);
      border-radius: 32px;
      padding: 32px 24px 18px;
      text-align: center;
      box-shadow: 0 20px 50px var(--shadow);
    }

    .cup-wrap {
      width: 92px;
      height: 92px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: var(--cup);
      display: grid;
      place-items: center;
    }

    .cup {
      width: 68px;
      height: 68px;
      color: var(--accent);
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 1.85rem;
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    .lead {
      margin: 12px 0 0;
      font-size: 1.12rem;
      line-height: 1.35;
      font-weight: 700;
    }

    .empty .lead {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .dest {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.4;
      font-weight: 600;
      word-break: break-word;
    }

    .dest:empty { display: none; }

    a.btn {
      display: block;
      margin-top: 22px;
      background: var(--accent);
      color: var(--accent-ink);
      text-decoration: none;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
      border-radius: 999px;
      padding: 16px 20px;
      min-height: 56px;
      box-shadow: 0 8px 0 var(--press);
    }

    a.btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    a.btn:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 var(--press);
    }

    [hidden] { display: none !important; }

    .hint {
      margin: 18px 0 0;
      padding-top: 14px;
      border-top: 2px dashed var(--line);
      color: var(--muted);
      font-size: 0.95rem;
    }

    .hint button {
      font: inherit;
      font-weight: 800;
      color: var(--ink);
      background: none;
      border: 0;
      padding: 8px 6px;
      cursor: pointer;
      border-radius: 999px;
    }

    .hint button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .browser {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body class="empty">
  <main class="card">
    <div class="cup-wrap">
      <svg class="cup" viewBox="0 0 80 80" aria-hidden="true">
        <ellipse cx="38" cy="66" rx="20" ry="4.5" fill="currentColor" opacity="0.18"></ellipse>
        <path d="M16 30h34v14a13 13 0 0 1-13 13h-8a13 13 0 0 1-13-13z" fill="currentColor"></path>
        <path d="M50 34h6.5a8 8 0 0 1 0 16H48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
        <path d="M28 20c3 4 3 6 0 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="0.75"></path>
        <path d="M38 14c3 5 3 7 0 13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="0.75"></path>
        <path d="M48 20c3 4 3 6 0 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="0.75"></path>
      </svg>
    </div>
    <h1>Benji links</h1>
    <p class="lead" id="lead">Nothing to open</p>
    <p class="dest" id="dest">Try a message, a Gmail thread, or a web link.</p>
    <a class="btn" id="open" hidden href="#">Open</a>
    <a class="browser" id="browser" hidden>Open in browser instead</a>
    <p class="hint"><button type="button" id="back">Back</button> to the previous page</p>
  </main>
  <script>
    (function () {
      "use strict";

      var SMS_RE = /^[0-9+]*$/;
      var THREAD_RE = /^[A-Za-z0-9]*$/;
      var EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

      function safeDecode(value) {
        try {
          return decodeURIComponent(value);
        } catch (err) {
          return null;
        }
      }

      function isIOS() {
        var ua = navigator.userAgent || "";
        if (/iPad|iPhone|iPod/.test(ua)) return true;
        return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      }

      function rawHash() {
        var href = String(window.location.href || "");
        var mark = href.indexOf("#");
        return mark === -1 ? "" : href.slice(mark + 1);
      }

      function parseParams(raw) {
        if (raw.indexOf("url=") === 0) {
          var urlValue = safeDecode(raw.slice(4));
          if (urlValue === null) return null;
          return { url: urlValue };
        }

        var params = {};
        var parts = raw.split("&");
        for (var i = 0; i < parts.length; i++) {
          var part = parts[i];
          if (part === "") continue;
          var eq = part.indexOf("=");
          if (eq <= 0) return null;
          var key = safeDecode(part.slice(0, eq));
          var val = safeDecode(part.slice(eq + 1));
          if (key === null || val === null) return null;
          if (key !== "sms" && key !== "gmail" && key !== "acct" && key !== "body") continue;
          if (Object.prototype.hasOwnProperty.call(params, key)) return null;
          params[key] = val;
        }
        return params;
      }

      function httpUrl(value) {
        var url;
        try {
          url = new URL(value);
        } catch (err) {
          return null;
        }
        if (url.protocol !== "http:" && url.protocol !== "https:") return null;
        if (!url.hostname) return null;
        return url.href;
      }

      function planFromRaw(raw) {
        if (!raw) return null;
        var params = parseParams(raw);
        if (!params) return null;

        var hasSms = Object.prototype.hasOwnProperty.call(params, "sms");
        var hasGmail = Object.prototype.hasOwnProperty.call(params, "gmail");
        var hasUrl = Object.prototype.hasOwnProperty.call(params, "url");
        if ((hasSms ? 1 : 0) + (hasGmail ? 1 : 0) + (hasUrl ? 1 : 0) !== 1) return null;

        var hasBody = Object.prototype.hasOwnProperty.call(params, "body");
        if (hasBody && !hasSms) return null;
        if (hasSms && hasBody) {
          // Suggested reply: open this conversation with the text prefilled (iOS: sms:NUM&body=, others: sms:NUM?body=).
          if (!SMS_RE.test(params.sms) || !params.sms || !params.body || params.body.length > 1000) return null;
          return {
            kind: "sms",
            href: "sms:" + params.sms + (isIOS() ? "&" : "?") + "body=" + encodeURIComponent(params.body),
            label: "Open in Messages",
            lead: "Opening Messages with your reply filled in.",
            dest: params.body
          };
        }

        if (hasSms) {
          if (!SMS_RE.test(params.sms)) return null;
          return {
            kind: "sms",
            href: "sms:" + params.sms,
            label: "Open in Messages",
            lead: params.sms ? "Opening this conversation in Messages." : "Opening the Messages app.",
            dest: params.sms
          };
        }

        if (hasGmail) {
          if (!Object.prototype.hasOwnProperty.call(params, "acct")) return null;
          if (!THREAD_RE.test(params.gmail)) return null;
          if (!EMAIL_RE.test(params.acct) || params.acct.length > 254) return null;
          var thread = params.gmail;
          var acct = params.acct;
          var fallback = "https://mail.google.com/mail/u/?authuser=" + encodeURIComponent(acct) +
            (thread ? "#all/" + thread : "#inbox");
          return {
            kind: "gmail",
            href: "googlegmail://",
            fallback: fallback,
            label: "Open in Gmail",
            lead: "Opening the Gmail app.",
            dest: acct
          };
        }

        var dest = httpUrl(params.url);
        if (!dest) return null;
        return {
          kind: "url",
          href: dest,
          label: "Open link",
          lead: "Opening the link.",
          dest: dest
        };
      }

      var openEl = document.getElementById("open");
      var browserEl = document.getElementById("browser");
      var leadEl = document.getElementById("lead");
      var destEl = document.getElementById("dest");
      var backEl = document.getElementById("back");

      backEl.addEventListener("click", function () {
        history.back();
      });

      function go(url, replace) {
        try {
          if (replace) window.location.replace(url);
          else window.location.href = url;
        } catch (err) {}
      }

      var plan = planFromRaw(rawHash());
      if (!plan) return;

      document.body.classList.remove("empty");
      leadEl.textContent = plan.lead;
      destEl.textContent = plan.dest;
      openEl.textContent = plan.label;
      openEl.href = plan.href;
      openEl.hidden = false;

      if (plan.kind === "url") {
        go(plan.href, true);
        return;
      }

      openEl.addEventListener("click", function (event) {
        event.preventDefault();
        window.location.href = plan.href;
      });
      go(plan.href, false);

      if (plan.kind === "gmail") {
        browserEl.href = plan.fallback;
        browserEl.target = "_blank";
        browserEl.rel = "noopener";
        window.setTimeout(function () {
          if (document.hidden) return;
          browserEl.hidden = false;
        }, 3000);
      }
    })();
  </script>
</body>
</html>
